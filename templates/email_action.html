{% extends "base.html" %}
{% block title %}{{ title }} — {{ site.site_title }}{% endblock %}
{% block content %}
<section class="contact-page email-action-page">
  <span class="eyebrow">THÔNG BÁO QUA EMAIL</span>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if show_action %}
    <form method="post" action="{{ action_url }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="button button-dark" type="submit">{{ action_label }} <span>→</span></button>
    </form>
  {% endif %}
  <p><a class="text-link" href="{{ url_for('home') }}">Quay về trang chủ →</a></p>
</section>
{% endblock %}
